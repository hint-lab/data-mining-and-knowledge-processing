name: Lab 1 checks
on:
  push:
    paths: ['2026-autumn/exp01-word2vec/**', '.github/workflows/lab1.yml']
  pull_request:
    paths: ['2026-autumn/exp01-word2vec/**', '.github/workflows/lab1.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 2026-autumn/exp01-word2vec/requirements.txt
      - run: python -m pip install -r 2026-autumn/exp01-word2vec/requirements.txt
      - run: python -m unittest discover -s 2026-autumn/exp01-word2vec/tests -v
